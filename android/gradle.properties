# FAITHFUL COMPANION - RELEASE SIGNING CONFIGURATION
# ⚠️ NEVER COMMIT THIS FILE TO GIT! (Already in .gitignore)
# This file contains sensitive passwords for your app signing key

# Path to your release keystore (relative to android/app/)
MYAPP_RELEASE_STORE_FILE=../../faithful-companion-release.keystore

# Keystore alias (identifier for your key)
MYAPP_RELEASE_KEY_ALIAS=faithful-companion

# REPLACE THESE WITH YOUR ACTUAL PASSWORDS:
# (The passwords you used when generating the keystore)
MYAPP_RELEASE_STORE_PASSWORD=Mi$ter9248
MYAPP_RELEASE_KEY_PASSWORD=Mi$ter9248

# Additional Gradle settings for better performance
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# Android build settings
android.useAndroidX=true
android.enableJetifier=true

# Hermes JavaScript engine (recommended for production)
hermesEnabled=true
